<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00318A">
  <title>Bedankt! — SMSAK Social Scheduler</title>
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;
      background:#050D21;color:#F4F6FB;font-family:'Barlow',system-ui,sans-serif;line-height:1.6;
      padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
    .card{max-width:520px;text-align:center;background:#0A1730;border:1px solid rgba(168,179,204,.16);border-radius:18px;padding:44px 30px}
    .check{width:72px;height:72px;border-radius:50%;background:#00A86B;display:grid;place-items:center;font-size:36px;margin:0 auto 22px}
    h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(2rem,7vw,2.8rem);margin:0 0 10px}
    p{color:#A8B3CC;margin:0 0 12px}
    a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 26px;margin-top:14px;
      background:#F5C000;color:#101010;font-weight:700;border-radius:10px;text-decoration:none}
    .credit{margin-top:26px;font-size:13px;color:#9a9a9a}
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Bedankt voor je bestelling!</h1>
    <p>Zodra je betaling bevestigd is, ontvang je binnen 24 uur je logingegevens en factuur op het opgegeven e-mailadres.</p>
    <p>Vragen? Mail <a href="mailto:social@smsak.be" style="color:#F5C000">social@smsak.be</a> of bel <a href="tel:+32467010468" style="color:#F5C000">+32 467 01 04 68</a>.</p>
    <a class="btn" href="/">Terug naar de site</a>
    <div class="credit">© SMSAK | www.smsak.be | KBO BE1035.506.672</div>
  </div>
</body>
</html>
